name: Cruise price check

on:
  schedule:
    # Every 6 hours. Kept infrequent deliberately — see plan/06-risks.md
    # (ToS / bot-detection risk mitigation via low request rates).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  check-prices:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # curl_cffi provides the Chrome TLS-fingerprint impersonation needed
        # to get past Akamai Bot Manager on the RCCL pricing pages — see
        # scraper/python/fetch_room_pricing.py and
        # scraper/src/lines/rccl-shared.ts for why this can't be plain Node.
        run: pip install -r python/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Only needed once a Phase 3 line falls back to DOM scraping.
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run price check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run start
