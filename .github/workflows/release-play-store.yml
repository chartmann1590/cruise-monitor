name: Release to Play Store

# Builds signed release App Bundles for the phone app and the Wear OS
# companion (published as separate AABs within the same Play Console app
# listing — both share applicationId "com.cruisewatch.app" so Play delivers
# each to the right form factor) and publishes them to Google Play.
#
# Requires these repository secrets (see plan/05-phase4-play-store.md):
#   RELEASE_KEYSTORE_BASE64      - `base64 -w0 Key.jks` output of the release keystore
#   RELEASE_KEYSTORE_PASSWORD    - keystore password
#   RELEASE_KEY_ALIAS            - signing key alias
#   RELEASE_KEY_PASSWORD         - signing key password
#   PLAY_SERVICE_ACCOUNT_JSON    - full JSON key for the Play Console service account
#   ADMOB_APP_ID                 - AdMob application ID (ca-app-pub-...~...)
#   ADMOB_BANNER_AD_UNIT_ID      - AdMob banner ad unit ID (ca-app-pub-.../...)
#   ADMOB_INTERSTITIAL_AD_UNIT_ID - AdMob interstitial ad unit ID

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track to publish to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/release.jks"

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.jks
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build release App Bundles (phone + wear)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
        run: ./gradlew :app:bundleRelease :wear:bundleRelease --no-daemon

      - name: Clean up signing secrets from disk
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cruisewatch.app
          releaseFiles: |
            app/build/outputs/bundle/release/app-release.aab
            wear/build/outputs/bundle/release/wear-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
